name: WQ-11 disposable Windows Client.Tests
on:
  push:
    branches:
      - fix/wq11-windows-hermetic-client-tests
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-client-tests:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x

      - name: Attest disposable scratch outside Windows user profile
        shell: pwsh
        run: |
          $scratch = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\')
          $profile = [IO.Path]::GetFullPath($env:USERPROFILE).TrimEnd('\')
          if (-not [IO.Directory]::Exists($scratch)) { throw "Missing RUNNER_TEMP" }
          if ($scratch.Equals($profile, [StringComparison]::OrdinalIgnoreCase) -or
              $scratch.StartsWith(($profile + '\'), [StringComparison]::OrdinalIgnoreCase)) {
            throw "RUNNER_TEMP is inside user profile; refuse test execution."
          }
          Write-Output "Disposable scratch parent: $scratch"
          Write-Output "GitHub-hosted ephemeral Windows runner; no real operator profile is mounted."

      - name: Restore and build .NET 11 Release (no test execution)
        shell: pwsh
        run: |
          dotnet --version
          dotnet restore Client.Tests/Client.Tests.fsproj --nologo
          if ($LASTEXITCODE -ne 0) { throw "Restore failed" }
          dotnet build Client.Tests/Client.Tests.fsproj -c Release --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Focused Windows known-folder, junction and Git identity tests
        shell: pwsh
        run: |
          dotnet fsi scripts/test-client-hermetic.fsx -- --scratch-parent "$env:RUNNER_TEMP" --no-build --filter "FullyQualifiedName~HermeticHarnessTests" --timeout-seconds 180 --self-test-git-sentinel
          if ($LASTEXITCODE -ne 0) { throw "Focused hermetic tests failed" }

      - name: Direct testhost must reject forged profile root before writes
        shell: pwsh
        run: |
          # The hosted Windows account is ephemeral. Never create the forged
          # profile location: rejection must happen before any Client write.
          $profile = [Environment]::GetFolderPath([Environment+SpecialFolder]::UserProfile)
          $forged = Join-Path $profile ("jarvis-client-tests-" + [Guid]::NewGuid().ToString("N"))
          if (Test-Path -LiteralPath $forged) { throw "Unsafe negative fixture already exists" }
          $mapping = @{
            JARVIS_CLIENT_TEST_HERMETIC_ROOT = $forged
            JARVIS_CLIENT_TEST_DISPOSABLE_PARENT = $profile
            HOME = (Join-Path $forged "home")
            USERPROFILE = (Join-Path $forged "home")
            APPDATA = (Join-Path $forged "config")
            LOCALAPPDATA = (Join-Path $forged "data")
          }
          $saved = @{}
          foreach ($key in $mapping.Keys) {
            $saved[$key] = [Environment]::GetEnvironmentVariable($key, "Process")
            [Environment]::SetEnvironmentVariable($key, $mapping[$key], "Process")
          }
          try {
            $PSNativeCommandUseErrorActionPreference = $false
            $binary = "Client.Tests/bin/Release/net11.0"
            $output = (& dotnet vstest "$binary/Client.Tests.dll" /Framework:net11.0 "/TestAdapterPath:$binary" "/TestCaseFilter:FullyQualifiedName~HermeticHarnessTests" 2>&1 | Out-String)
            $code = $LASTEXITCODE
          } finally {
            foreach ($key in $saved.Keys) {
              [Environment]::SetEnvironmentVariable($key, $saved[$key], "Process")
            }
          }
          Write-Output $output
          if ($code -eq 0) { throw "Unsafe profile root was accepted by direct VSTest" }
          if ($output -notmatch "Refusing Windows Client.Tests root overlapping an actual OS profile folder") {
            throw "Direct VSTest failed without the expected native-profile provenance rejection (exit $code)"
          }
          if (Test-Path -LiteralPath $forged) { throw "Direct VSTest wrote inside the forbidden profile root" }
          Write-Output "Forged profile root rejected before writes: exit=$code; root-exists=false"

      - name: Full bounded Client.Tests .NET 11 Release
        shell: pwsh
        run: |
          dotnet fsi scripts/test-client-hermetic.fsx -- --scratch-parent "$env:RUNNER_TEMP" --no-build --timeout-seconds 1800
          if ($LASTEXITCODE -ne 0) { throw "Full hermetic suite failed" }

      - name: Two concurrent isolated Windows testhosts
        shell: pwsh
        run: |
          $root = $env:RUNNER_TEMP
          $cwd = $PWD.Path
          $script = {
            param($scratch, $repository)
            Set-Location $repository
            & dotnet fsi scripts/test-client-hermetic.fsx -- --scratch-parent $scratch --no-build --filter "FullyQualifiedName~HermeticHarnessTests" --timeout-seconds 180
            if ($LASTEXITCODE -ne 0) { throw "Concurrent hermetic testhost failed ($LASTEXITCODE)" }
          }
          $a = Start-Job -ScriptBlock $script -ArgumentList $root, $cwd
          $b = Start-Job -ScriptBlock $script -ArgumentList $root, $cwd
          try {
            $complete = @($a, $b) | Wait-Job -Timeout 420
            @($a, $b) | ForEach-Object {
              Receive-Job -Job $_
              if ($_.State -ne "Completed") { throw "Concurrent testhost: $($_.State)" }
            }
          } finally {
            @($a, $b) | Stop-Job -ErrorAction SilentlyContinue
            @($a, $b) | Remove-Job -Force -ErrorAction SilentlyContinue
          }

      - name: Failed setup must exit nonzero and remove its private scratch
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $text = (& dotnet fsi scripts/test-client-hermetic.fsx -- --scratch-parent "$env:RUNNER_TEMP" --self-test-failed-setup 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $text
          if ($code -ne 1) { throw "Injected setup failure unexpectedly returned $code (wanted 1)" }
          if ($text -notmatch "scratch cleanup verified = true") { throw "Missing cleanup proof" }

      - name: Zero discovery must fail with exact cleanup
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $text = (& dotnet fsi scripts/test-client-hermetic.fsx -- --scratch-parent "$env:RUNNER_TEMP" --no-build --filter "FullyQualifiedName~definitely_nonexistent_wq11_test" --timeout-seconds 90 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $text
          if ($code -ne 2) { throw "Zero discovery returned $code (wanted 2)" }
          if ($text -notmatch "executed tests 0") { throw "Missing zero-discovery diagnostic" }
          if ($text -notmatch "scratch cleanup verified = true") { throw "Missing zero-discovery cleanup proof" }

      - name: Hard timeout kills Windows testhost and removes scratch
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $text = (& dotnet fsi scripts/test-client-hermetic.fsx -- --scratch-parent "$env:RUNNER_TEMP" --no-build --timeout-seconds 10 2>&1 | Out-String)
          $code = $LASTEXITCODE
          Write-Output $text
          if ($code -ne 124) { throw "Hard timeout returned $code (wanted 124)" }
          if ($text -notmatch "scratch cleanup verified = true") { throw "Missing timeout cleanup proof" }
